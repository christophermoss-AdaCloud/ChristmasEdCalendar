<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Educational Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎄 Christmas Educational Calendar 🎄</h1>
            <p class="subtitle">Discover something new each day of December!</p>
        </header>

        <div class="calendar-grid" id="calendar">
            <!-- Calendar doors will be generated by JavaScript -->
        </div>

        <footer>
            <p>© 2024 Christmas Educational Calendar | Learn something new every day!</p>
        </footer>
    </div>

    <!-- Modal for displaying daily content -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Day 1</h2>
            <div id="modal-body">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
